services:
  stammdaten-check:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # only reachable from this machine. Set a key before you open the port, see README
      STAMMDATEN_API_KEY: ${STAMMDATEN_API_KEY:-}
    volumes:
      - stammdaten-data:/data

volumes:
  stammdaten-data:
